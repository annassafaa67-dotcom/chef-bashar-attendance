<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مصمم المخططات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--pr:#1e6fd9;--prl:rgba(30,111,217,.12);--bg:#eef1f5;--card:#fff;--tx:#1d2330;--mu:#6b7385;--bd:#d8dde6;--cv:#fbfcfd;--g1:#edf0f4;--g2:#d5dbe4;--wall:#2b2f38;--er:#d23b3b;--ok:#18975a}
body.dark{--bg:#12151b;--card:#1c2029;--tx:#e8ebf0;--mu:#99a2b4;--bd:#323946;--cv:#171a21;--g1:#232832;--g2:#2f3644;--wall:#dfe3ea}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,'Segoe UI',Arial,sans-serif;font-size:14px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.hide{display:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:8px 14px;background:var(--pr);color:#fff;cursor:pointer;font-weight:600;text-decoration:none;min-height:38px}
.btn.sec{background:var(--g1);color:var(--tx);border:1px solid var(--bd)}
.btn.dan{background:var(--er);color:#fff}
.btn.sm{padding:4px 10px;min-height:30px;font-size:13px;border-radius:8px}
.btn.cfm{background:#e08a00!important;color:#fff!important}
.btn:disabled{opacity:.45;cursor:default}
.inp{width:100%;padding:7px 10px;border:1px solid var(--bd);border-radius:9px;background:var(--card);min-height:38px}
.inp:disabled{opacity:.7;background:var(--g1)}
label.f{display:block;margin:7px 0;font-size:12.5px;color:var(--mu)}
label.f>.inp{margin-top:3px;color:var(--tx)}
.ck{display:flex;gap:7px;align-items:center;font-size:13px;margin:7px 0;cursor:pointer}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{flex:1}
.row>.nf{flex:none}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
h3{margin:2px 0 8px;font-size:15.5px}
.mu{color:var(--mu);font-size:12.5px}
.sep{border:0;border-top:1px solid var(--bd);margin:12px 0}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(25,30,40,.94);color:#fff;padding:10px 18px;border-radius:12px;opacity:0;transition:.25s;z-index:200;pointer-events:none;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
.scr{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(140deg,var(--bg),var(--card));z-index:90;overflow:auto}
.box{width:100%;max-width:390px;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:22px;box-shadow:0 10px 40px rgba(0,0,0,.08);margin:auto}
.logo{width:62px;height:62px;margin:0 auto 4px;display:block}
.ttl{text-align:center;margin:2px 0;font-size:20px}
.cred{text-align:center;font-size:12px;color:var(--mu);margin-top:14px;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;user-select:none}
.cred a{display:inline-flex}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#top{flex:none;height:54px;display:flex;align-items:center;gap:5px;padding:0 8px;background:var(--card);border-bottom:1px solid var(--bd);z-index:12}
.ib{border:0;background:none;min-width:38px;height:38px;border-radius:9px;cursor:pointer;font-size:18px;display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:0 7px;color:var(--tx);flex:none}
.ib:hover{background:var(--g1)}
.ib:disabled{opacity:.3;cursor:default}
#pname{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;cursor:pointer}
.seg{display:inline-flex;background:var(--g1);border-radius:10px;padding:3px;flex:none}
.seg button{border:0;background:none;padding:4px 11px;border-radius:8px;cursor:pointer;font-weight:700}
.seg button.on{background:var(--card);color:var(--pr);box-shadow:0 1px 3px rgba(0,0,0,.15)}
#floorSel{width:auto;min-height:34px;padding:3px 6px;max-width:120px;flex:none}
#badge{background:#fff3cd;color:#7a5600;border-radius:8px;padding:3px 8px;font-size:12px;font-weight:700;white-space:nowrap;cursor:pointer}
#main{flex:1;display:flex;min-height:0;position:relative}
#tools{flex:none;width:70px;background:var(--card);border-inline-end:1px solid var(--bd);overflow-y:auto;display:flex;flex-direction:column;padding:4px;gap:1px}
.tb{border:0;background:none;border-radius:10px;padding:5px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:0;font-size:11px;color:var(--tx);flex:none}
.tb i{font-style:normal;font-size:19px;line-height:1.25}
.tb.on{background:var(--prl);color:var(--pr);font-weight:700}
.tb:disabled{opacity:.3}
#stage{flex:1;position:relative;min-width:0;overflow:hidden;background:var(--cv)}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#props{flex:none;width:280px;background:var(--card);border-inline-start:1px solid var(--bd);overflow-y:auto;padding:8px 12px 20px}
#hint{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:6px 10px;display:flex;gap:6px;align-items:center;box-shadow:0 4px 14px rgba(0,0,0,.1);font-size:12.5px;width:max-content;max-width:calc(100% - 20px);flex-wrap:wrap;justify-content:center;z-index:5}
#hint input{width:110px;min-height:30px;padding:3px 8px}
#v3bar{position:absolute;top:10px;right:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap;z-index:5;pointer-events:none}
#v3bar>*{pointer-events:auto}
.chip{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:5px 10px;cursor:pointer;font-size:12.5px;display:inline-flex;gap:5px;align-items:center;user-select:none}
.chip.on{background:var(--pr);color:#fff;border-color:var(--pr)}
#joy{position:absolute;bottom:16px;left:16px;display:grid;grid-template-columns:repeat(3,50px);gap:6px;z-index:5;direction:ltr}
#joy button{height:50px;border-radius:12px;border:1px solid var(--bd);background:var(--card);font-size:20px;touch-action:none;cursor:pointer;color:var(--tx)}
#zoomb{position:absolute;bottom:12px;left:12px;display:flex;flex-direction:column;gap:6px;z-index:5}
#zoomb button{width:40px;height:40px;border-radius:10px;border:1px solid var(--bd);background:var(--card);font-size:18px;cursor:pointer;color:var(--tx)}
.pnl{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;display:none}
.pnl.show{display:block}
.ph{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:6px;padding:7px 10px;z-index:2}
.ph b{flex:1;font-size:16px}
.pb{max-width:840px;margin:0 auto;padding:12px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.mbtn{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;font-size:13.5px;color:var(--tx)}
.mbtn i{font-style:normal;font-size:27px}
.mbtn:hover{border-color:var(--pr)}
.lrow{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--card);margin:8px 0;flex-wrap:wrap}
.lrow .grow{flex:1;min-width:140px}
.lrow.cur{border-color:var(--pr);box-shadow:0 0 0 2px var(--prl)}
#lib{position:fixed;top:54px;bottom:0;right:0;width:340px;max-width:100%;background:var(--card);border-inline-end:1px solid var(--bd);z-index:30;display:none;flex-direction:column;box-shadow:-6px 0 24px rgba(0,0,0,.12)}
#lib.show{display:flex}
.lcat{font-weight:700;margin:12px 2px 6px;font-size:13px;color:var(--mu)}
.lgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.li{border:1px solid var(--bd);border-radius:11px;padding:6px 4px;text-align:center;cursor:pointer;font-size:11.5px;background:var(--card);color:var(--tx)}
.li:hover{border-color:var(--pr)}
.li canvas{width:62px;height:62px;display:block;margin:0 auto 2px}
.pt{font-weight:700;font-size:15px;margin:4px 0 6px;display:flex;align-items:center;gap:6px}
.stat{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--bd);font-size:13px}
.lock{font-size:11px;color:#b07a00}
#prv{background:#e9ecf0}
.prPage{background:#fff;color:#000;max-width:1000px;margin:12px auto;padding:22px;position:relative;overflow:hidden;font-family:Cairo,Tahoma,Arial,sans-serif}
.prPage table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
.prPage td,.prPage th{border:1px solid #999;padding:4px 8px;text-align:center}
.wm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:90px;color:rgba(210,0,0,.13);transform:rotate(-25deg);pointer-events:none;font-weight:700;white-space:nowrap}
.code{font-size:20px;letter-spacing:2px;font-weight:700;direction:ltr;display:inline-block}
@media(max-width:760px){
 #main{flex-direction:column}
 #tools{order:3;width:auto;height:62px;flex-direction:row;overflow-x:auto;overflow-y:hidden;border:0;border-top:1px solid var(--bd)}
 .tb{min-width:56px}
 #props{display:none;position:absolute;left:0;right:0;bottom:62px;width:auto;max-height:48%;z-index:15;border:0;border-top:1px solid var(--bd);box-shadow:0 -6px 20px rgba(0,0,0,.14);border-radius:16px 16px 0 0}
 #props.open{display:block}
 #propsT{display:inline-flex!important}
 .dsk{display:none!important}
 #lib{top:auto;height:62%;width:100%;bottom:0;border-radius:16px 16px 0 0}
 #zoomb{bottom:10px}
 .seg button{padding:4px 8px}
 #floorSel{max-width:86px;font-size:12px}
 #top{gap:2px;padding:0 4px}
 .ib{min-width:34px;padding:0 4px}
}
#propsT{display:none}
@media print{
 body>*{display:none!important}
 #prv{display:block!important;position:static;background:#fff;overflow:visible}
 #prv .ph,.noprint{display:none!important}
 .prPage{margin:0;max-width:none;padding:0 4mm;page-break-after:always}
 .prPage:last-child{page-break-after:auto}
}
</style>
</head>

<input type="file" id="fileIn" accept=".json,application/json" class="hide">
<script>
const SRC='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
const LIC=/*LIC*/{"m":0}/*LIC*/;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const P='fp_'+(LIC.id||'main')+'_';
function ld(k,d){try{const v=localStorage.getItem(P+k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(P+k,JSON.stringify(v));return true}catch(e){toast('⚠️ تعذّر الحفظ في المتصفح (المساحة ممتلئة أو التخزين محظور)');return false}}
function cyrb53(str,seed=0){let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507);h1^=Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507);h2^=Math.imul(h1^(h1>>>13),3266489909);return(4294967296*(2097151&h2)+(h1>>>0)).toString(36)}
function H(s){let h=String(s);for(let i=0;i<400;i++)h=cyrb53(h+'|'+i,i);return h}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const AR=s=>String(s).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const r1=v=>Math.round(v*10)/10;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),3000)}
function twice(b){clearTimeout(b._t);if(b.dataset.cf){delete b.dataset.cf;b.innerHTML=b.dataset.ot;b.classList.remove('cfm');return true}b.dataset.ot=b.innerHTML;b.dataset.cf=1;b.innerHTML='تأكيد؟';b.classList.add('cfm');b._t=setTimeout(()=>{if(b.dataset.cf){delete b.dataset.cf;b.innerHTML=b.dataset.ot;b.classList.remove('cfm')}},3000);return false}
function dl(name,data,type='application/json'){const blob=data instanceof Blob?data:new Blob([data],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
function dlURL(name,url){const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),500)}
function shade(hex,f){if(!/^#[0-9a-f]{6}$/i.test(hex))return hex;let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);const t=f<0?0:255,p=Math.abs(f);r=Math.round((t-r)*p+r);g=Math.round((t-g)*p+g);b=Math.round((t-b)*p+b);return'#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('')}
function rgba(hex,a=1){if(hex==='g')return[.6,.8,.92,.35];const m=/^#([0-9a-f]{6})$/i.exec(hex||'');if(!m)return[.7,.7,.7,a];const n=parseInt(m[1],16);return[(n>>16&255)/255,(n>>8&255)/255,(n&255)/255,a]}
const fmtL=(cm,pr)=>{const s=(cm/100).toFixed(2)+' م';return pr?AR(s):s};
const fmtA=(cm2,pr)=>{const s=(cm2/1e4).toFixed(2)+' م²';return pr?AR(s):s};

/* ======= الإعدادات والبيانات ======= */
let cfg=ld('cfg',{});
cfg.dz=cfg.dz||{n:'',wa:'',tg:''};cfg.ci=cfg.ci||{};cfg.ciOv=cfg.ciOv||{};cfg.tx=cfg.tx||{};
if(cfg.showLen===undefined)cfg.showLen=true;
const saveCfg=()=>sv('cfg',cfg);
const TXD={t:'مصمم المخططات',s:'رسم مخططات المباني والشقق والتصميم الداخلي ثلاثي الأبعاد'};
const DZ=()=>LIC.m?(LIC.dz||{}):cfg.dz;
const DPH=()=>LIC.m?LIC.dph:cfg.dph;
const TX=()=>Object.assign({},TXD,LIC.tx||{},cfg.tx||{});
const THC=()=>cfg.th||LIC.th||'#1e6fd9';
const CIF=[['org','اسم المكتب / المؤسسة'],['addr','المحافظة / العنوان'],['mgr','اسم المدير'],['role','الصفة'],['ph','رقم الهاتف']];
const civ=f=>cfg.ciOv[f]||(LIC.ci&&LIC.ci[f])||cfg.ci[f]||'';
const ciLocked=f=>!!civ(f)&&!isDz();
let users=ld('users',null);
if(!users||!users.length){users=[{u:'manager',ph:H('manager|1234'),role:'manager',n:'المدير',def:1}];sv('users',users)}
let projects=ld('projects',[]);
let T=ld('trial',{});
let me=null,isDzF=false;

const wl=w=>Math.hypot(w.x2-w.x1,w.y2-w.y1);
function closest(p,w){const dx=w.x2-w.x1,dy=w.y2-w.y1,L2=dx*dx+dy*dy||1;const t=clamp(((p.x-w.x1)*dx+(p.y-w.y1)*dy)/L2,0,1);const x=w.x1+dx*t,y=w.y1+dy*t;return{x,y,t,d:Math.hypot(p.x-x,p.y-y),L:Math.sqrt(L2)}}
function segD(p,x1,y1,x2,y2){return closest(p,{x1,y1,x2,y2}).d}
function polyArea(pts){let a=0;for(let i=0;i<pts.length;i++){const p=pts[i],q=pts[(i+1)%pts.length];a+=p[0]*q[1]-q[0]*p[1]}return a/2}
function polyPer(pts){let s=0;for(let i=0;i<pts.length;i++){const p=pts[i],q=pts[(i+1)%pts.length];s+=Math.hypot(q[0]-p[0],q[1]-p[1])}return s}
function centroid(pts){const A=polyArea(pts);if(Math.abs(A)<1){let x=0,y=0;pts.forEach(p=>{x+=p[0];y+=p[1]});return[x/pts.length,y/pts.length]}let cx=0,cy=0;for(let i=0;i<pts.length;i++){const p=pts[i],q=pts[(i+1)%pts.length],f=p[0]*q[1]-q[0]*p[1];cx+=(p[0]+q[0])*f;cy+=(p[1]+q[1])*f}return[cx/(6*A),cy/(6*A)]}
function inPoly(x,y,pts){let c=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const a=pts[i],b=pts[j];if((a[1]>y)!==(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])c=!c}return c}

 q('#dCi').onclick=ciPanel;
 q('#dOut').onclick=()=>{isDzF=false;if(me.u==='__dz'){logout();return}const u=users.find(x=>x.u===me.u);if(u)me.role=u.role;try{const s=ld('sess',null);if(s&&s.dz)sv('sess',null)}catch(e){}toast('خرجت من وضع المصمم');closePanel();renderProps()}})}
function tplPanel(){const L=tplList();openPanel('📐 القوالب',`<div class="card"><h3>حفظ المشروع الحالي كقالب</h3><div class="row"><input id="tpN" class="inp" value="${esc(cur?cur.n:'')}"><button class="btn nf" id="tpS">💾 حفظ كقالب</button></div><div class="mu" style="margin-top:6px">القوالب تظهر عند إنشاء مشروع جديد، وتُضمَّن في نسخ العملاء.</div></div>${L.map((t,i)=>`<div class="lrow"><div class="grow"><b>${esc(t.n)}</b><div class="mu">${t.fixed?'مضمَّن في هذه النسخة':'محفوظ هنا'} · ${t.d.floors.length} طابق</div></div>${t.fixed?'':`<button class="btn sm dan" data-d="${i-(LIC.tpl||[]).length}">🗑</button>`}</div>`).join('')||'<div class="mu">لا توجد قوالب بعد</div>'}`,b=>{b.querySelector('#tpS').onclick=()=>{if(!cur)return;persistNow();const a=ld('tpls',[]);a.push({id:uid(),n:$('#tpN').value.trim()||cur.n,d:JSON.parse(JSON.stringify(D))});sv('tpls',a);toast('حُفظ القالب');tplPanel()};b.onclick=e=>{const t=e.target.closest('[data-d]');if(!t||!twice(t))return;const a=ld('tpls',[]),i=+t.dataset.d,x=a[i];const rm=()=>{sv('tpls',ld('tpls',[]).filter(z=>z.id!==x.id))},back=()=>{const c=ld('tpls',[]);if(!c.some(z=>z.id===x.id)){c.splice(i,0,x);sv('tpls',c)}};rm();pushU(back,rm);toast('حُذف القالب. اضغط ↶ تراجع لاسترجاعه');tplPanel()}},tplPanel)}
function copyPanel(){openPanel('📄 إنشاء نسخة لعميل',`<div class="card"><h3>معلومات العميل</h3><label class="f">اسم العميل (المرخَّص له) *<input id="cpN" class="inp"></label>${CIF.map(([k,l])=>`<label class="f">${l}<input class="inp" data-cc="${k}" placeholder="اتركه فارغاً ليكتبه العميل مرة واحدة"></label>`).join('')}</div><div class="card"><h3>نوع النسخة</h3><label class="ck"><input type="radio" name="cpT" value="t" checked> تجريبية لمدة <input id="cpD" type="number" class="inp" value="15" min="1" style="width:80px;min-height:30px"> يوم</label><label class="ck"><input type="radio" name="cpT" value="f"> كاملة مفعّلة</label><label class="ck"><input type="checkbox" id="cpTp" checked> تضمين قوالبي (${ld('tpls',[]).length})</label></div><button class="btn" id="cpGo" style="width:100%">📄 إنشاء وتنزيل نسخة العميل</button><div id="cpOut"></div><div class="mu" style="margin-top:10px">⚠️ النسخة تُنشأ من هذا الملف. إن عدّلت البرنامج لاحقاً فأنشئ نسخ العملاء من جديد.</div>`,b=>{b.querySelector('#cpGo').onclick=makeCopy})}
function makeCopy(){const cn=$('#cpN').value.trim();if(!cn){toast('اكتب اسم العميل');return}if(!cfg.dph){toast('أنشئ كلمة مرور المصمم أولاً');return}
 const mk='/*L'+'IC*/',parts=SRC.split(mk);if(parts.length!==3){toast('خطأ: تعذّر إنشاء النسخة من هذا الملف');return}
 const trial=document.querySelector('input[name=cpT]:checked').value==='t',days=trial?Math.max(1,parseInt($('#cpD').value)||15):0;
 const id='FP-'+rndStr(6),code=genCode(),ci={};$$('[data-cc]').forEach(i=>{const v=i.value.trim();if(v)ci[i.dataset.cc]=v});
 const lic={m:1,id,cn,ci,d:days,is:Date.now(),ah:H(id+code),dz:cfg.dz,dph:cfg.dph,tx:cfg.tx,th:cfg.th||'',tpl:$('#cpTp').checked?ld('tpls',[]):[]};
 const out=parts[0]+mk+JSON.stringify(lic).replace(/</g,'\\u003c')+mk+parts[2];
 dl(`${TX().t}-${cn}-${id}.html`.replace(/[\\/:*?"<>|]/g,'-'),out,'text/html;charset=utf-8');
 const cp=ld('copies',[]);cp.unshift({id,cn,code,d:days,at:Date.now()});sv('copies',cp);
 const msg=`رمز تفعيل برنامج ${TX().t}\nالعميل: ${cn}\nرقم النسخة: ${id}\nرمز التفعيل: ${code}`;
 $('#cpOut').innerHTML=`<div class="card" style="border-color:var(--ok)"><b>✅ أُنشئت النسخة ونُزّلت</b><div class="stat"><span>رقم النسخة</span><b dir="ltr">${id}</b></div><div class="stat"><span>النوع</span><b>${days?'تجريبية '+days+' يوم':'كاملة'}</b></div><div style="text-align:center;margin:10px 0">رمز التفعيل (أعطه للعميل عند الدفع):<br><span class="code">${code}</span></div><div class="row"><button class="btn sec" id="cpC">📋 نسخ الرمز</button><a class="btn" style="background:#25D366" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(msg)}">إرسال واتساب</a></div></div>`;$('#cpC').onclick=()=>copyText(code)}
function copiesPanel(){const L=ld('copies',[]);openPanel('📋 النسخ الصادرة',L.length?L.map((c,i)=>`<div class="lrow"><div class="grow"><b>${esc(c.cn)}</b><div class="mu"><span dir="ltr">${esc(c.id)}</span> · ${new Date(c.at).toLocaleDateString('ar-IQ')} · ${c.d?'تجريبية '+c.d+' يوم':'كاملة'}</div><div class="code" style="font-size:15px">${esc(c.code)}</div></div><button class="btn sm sec" data-c="${i}">📋 نسخ الرمز</button><button class="btn sm dan" data-d="${i}">🗑</button></div>`).join(''):'<div class="mu" style="margin:12px">لم تُصدر أي نسخة بعد</div>',b=>{b.onclick=e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.c!=null)copyText(L[+t.dataset.c].code);else if(t.dataset.d!=null&&twice(t)){const i=+t.dataset.d,x=L[i];const rm=()=>sv('copies',ld('copies',[]).filter(z=>z.id!==x.id)),back=()=>{const c=ld('copies',[]);if(!c.some(z=>z.id===x.id)){c.splice(i,0,x);sv('copies',c)}};rm();pushU(back,rm);toast('حُذف السجل. اضغط ↶ تراجع لاسترجاعه');copiesPanel()}}},copiesPanel)}
function helpPanel(){openPanel('❓ طريقة الاستخدام',`<div class="card"><h3>✏️ الرسم</h3><ul style="line-height:2;margin:0;padding-inline-start:20px"><li><b>جدار:</b> انقر للبداية ثم عند كل زاوية. انقر على آخر نقطة للإنهاء، والعودة لنقطة البداية تغلق الغرفة وتنشئ أرضيتها. اكتب الطول بالسنتيمتر في المربع واضغط Enter لرسم طول دقيق.</li><li><b>غرفة:</b> اسحب لرسم غرفة مستطيلة بجدرانها وأرضيتها.</li><li><b>أرضية:</b> ارسم حدود أرضية بأي شكل.</li><li><b>باب / نافذة:</b> انقر على أي جدار، ثم اسحبها على الجدار لتغيير موضعها.</li><li><b>أثاث:</b> اختر قطعة من المكتبة ثم انقر لوضعها. اسحب الدائرة الزرقاء للتدوير والمربع الأبيض لتغيير المقاس.</li><li><b>قياس:</b> اسحب بين نقطتين لإظهار المسافة.</li><li>الالتقاط التلقائي يلصق النقاط بأطراف الجدران والشبكة والزوايا ٤٥°. اضغط Shift لإيقافه.</li></ul></div>
<div class="card"><h3>🖱 التحكم</h3><ul style="line-height:2;margin:0;padding-inline-start:20px"><li>اسحب المساحة الفارغة للتحريك، والعجلة أو إصبعين للتكبير.</li><li>اضغط على أي عنصر لتعديل مقاساته ولونه من لوحة الخصائص.</li><li>Ctrl+Z تراجع · Ctrl+Y إعادة · Delete حذف · Ctrl+D نسخ · R تدوير · Esc إنهاء.</li></ul></div>
<div class="card"><h3>🧊 ثلاثي الأبعاد</h3><ul style="line-height:2;margin:0;padding-inline-start:20px"><li><b>دوران:</b> اسحب للدوران، وزر الفأرة الأيمن أو Shift للتحريك، والعجلة للتقريب.</li><li><b>تجوّل:</b> تمشَّ داخل الشقة. اسحب للنظر، وW/S أو الأسهم للحركة، أو أزرار الشاشة على الهاتف.</li><li><b>جدران منخفضة:</b> لرؤية التوزيع الداخلي من الأعلى.</li></ul></div>
<div class="card"><h3>💾 الحفظ</h3><div>يُحفظ كل تغيير تلقائياً في المتصفح على هذا الجهاز. نزّل نسخة احتياطية بانتظام من القائمة، لأن مسح بيانات المتصفح يمسح المشاريع.</div></div>`)}

/* ======= الطباعة والتصدير ======= */
function planCanvas(f,maxW=1100,k=2){const b=bounds(f),pad=70;const bw=b.x1-b.x0+pad*2,bh=b.y1-b.y0+pad*2;const s=Math.min(maxW/bw,maxW*1.2/bh);const W=Math.round(bw*s),Hh=Math.round(bh*s)+34;const c=document.createElement('canvas');c.width=W*k;c.height=Hh*k;const ctx=c.getContext('2d');ctx.setTransform(k,0,0,k,0,0);renderPlan(ctx,W,Hh,{s,ox:(pad-b.x0)*s,oy:(pad-b.y0)*s},{print:true,floor:f});if(isTrial()){ctx.setTransform(1,0,0,1,0,0);wmark(ctx,c.width,c.height)}return c}
function exportPNG(){if(!D)return;planCanvas(F(),1400).toBlob(b=>dl((cur.n||'مخطط')+' - '+(F().n||'')+'.png',b));toast('⬇ جارٍ تنزيل صورة المخطط')}
function printView(){if(!D)return;persistNow();const dt=AR(new Date().toLocaleDateString('en-GB'));const org=civ('org'),addr=civ('addr'),mgr=civ('mgr'),role=civ('role');let h='';
 D.floors.forEach((f,i)=>{if(!f.walls.length&&!f.rooms.length&&!f.items.length)return;const url=planCanvas(f).toDataURL('image/png');let tot=0;const rows=f.rooms.map((r,j)=>{const a=Math.abs(polyArea(r.pts));tot+=a;return`<tr><td>${AR(j+1)}</td><td>${esc(r.n)}</td><td>${esc((FLOORS[r.m]||{}).n||'')}</td><td>${fmtA(a,1)}</td></tr>`}).join('');
  h+=`<div class="prPage">${isTrial()?'<div class="wm">نسخة تجريبية</div>':''}<div style="display:flex;justify-content:space-between;gap:10px;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:8px"><div><b style="font-size:19px">${esc(org||TX().t)}</b>${addr?`<div>${esc(addr)}</div>`:''}</div><div style="text-align:left"><b style="font-size:16px">${esc(cur.n)}</b><div>${esc(f.n||'')}</div><div>${dt}</div></div></div><img src="${url}" style="width:100%;display:block">${rows?`<table><tr><th>ت</th><th>الغرفة</th><th>الأرضية</th><th>المساحة</th></tr>${rows}<tr><th colspan="3">المجموع</th><th>${fmtA(tot,1)}</th></tr></table>`:''}${mgr?`<div style="margin-top:28px;text-align:left;padding-left:30px">${esc(role||'المدير')}<br><b>${esc(mgr)}</b></div>`:''}<div class="prCredL" style="text-align:center;font-size:11px;color:#555;margin-top:16px;border-top:1px solid #ccc;padding-top:6px">© جميع الحقوق محفوظة${DZ().n?' للمصمم: '+esc(DZ().n):''}${DZ().wa?' · واتساب: '+AR(esc(DZ().wa)):''}</div></div>`});
 $('#prB').innerHTML=h||'<div class="prPage">المخطط فارغ</div>';$('#prv').classList.add('show');$('#prCred').onchange();}
$('#prCred').onchange=()=>$$('.prCredL').forEach(e=>e.style.display=$('#prCred').checked?'':'none');
$('#prP').onclick=()=>window.print();$('#prD').onclick=exportPNG;$('#prX').onclick=()=>$('#prv').classList.remove('show');

window.addEventListener('beforeunload',persistNow);
document.addEventListener('visibilitychange',()=>{if(document.hidden)persistNow()});
function boot(){buildTools();applyTheme();fillTexts();if(isTrial()){const st=trialState();showAct(st);return}startLogin()}
boot();
