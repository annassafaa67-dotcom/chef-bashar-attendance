<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مصمم المخططات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--pr:#1e6fd9;--prl:rgba(30,111,217,.12);--bg:#eef1f5;--card:#fff;--tx:#1d2330;--mu:#6b7385;--bd:#d8dde6;--cv:#fbfcfd;--g1:#edf0f4;--g2:#d5dbe4;--wall:#2b2f38;--er:#d23b3b;--ok:#18975a}
body.dark{--bg:#12151b;--card:#1c2029;--tx:#e8ebf0;--mu:#99a2b4;--bd:#323946;--cv:#171a21;--g1:#232832;--g2:#2f3644;--wall:#dfe3ea}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,'Segoe UI',Arial,sans-serif;font-size:14px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.hide{display:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:8px 14px;background:var(--pr);color:#fff;cursor:pointer;font-weight:600;text-decoration:none;min-height:38px}
.btn.sec{background:var(--g1);color:var(--tx);border:1px solid var(--bd)}
.btn.dan{background:var(--er);color:#fff}
.btn.sm{padding:4px 10px;min-height:30px;font-size:13px;border-radius:8px}
.btn.cfm{background:#e08a00!important;color:#fff!important}
.btn:disabled{opacity:.45;cursor:default}
.inp{width:100%;padding:7px 10px;border:1px solid var(--bd);border-radius:9px;background:var(--card);min-height:38px}
.inp:disabled{opacity:.7;background:var(--g1)}
label.f{display:block;margin:7px 0;font-size:12.5px;color:var(--mu)}
label.f>.inp{margin-top:3px;color:var(--tx)}
.ck{display:flex;gap:7px;align-items:center;font-size:13px;margin:7px 0;cursor:pointer}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{flex:1}
.row>.nf{flex:none}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
h3{margin:2px 0 8px;font-size:15.5px}
.mu{color:var(--mu);font-size:12.5px}
.sep{border:0;border-top:1px solid var(--bd);margin:12px 0}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(25,30,40,.94);color:#fff;padding:10px 18px;border-radius:12px;opacity:0;transition:.25s;z-index:200;pointer-events:none;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
.scr{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(140deg,var(--bg),var(--card));z-index:90;overflow:auto}
.box{width:100%;max-width:390px;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:22px;box-shadow:0 10px 40px rgba(0,0,0,.08);margin:auto}
.logo{width:62px;height:62px;margin:0 auto 4px;display:block}
.ttl{text-align:center;margin:2px 0;font-size:20px}
.cred{text-align:center;font-size:12px;color:var(--mu);margin-top:14px;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;user-select:none}
.cred a{display:inline-flex}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#top{flex:none;height:54px;display:flex;align-items:center;gap:5px;padding:0 8px;background:var(--card);border-bottom:1px solid var(--bd);z-index:12}
.ib{border:0;background:none;min-width:38px;height:38px;border-radius:9px;cursor:pointer;font-size:18px;display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:0 7px;color:var(--tx);flex:none}
.ib:hover{background:var(--g1)}
.ib:disabled{opacity:.3;cursor:default}
#pname{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;cursor:pointer}
.seg{display:inline-flex;background:var(--g1);border-radius:10px;padding:3px;flex:none}
.seg button{border:0;background:none;padding:4px 11px;border-radius:8px;cursor:pointer;font-weight:700}
.seg button.on{background:var(--card);color:var(--pr);box-shadow:0 1px 3px rgba(0,0,0,.15)}
#floorSel{width:auto;min-height:34px;padding:3px 6px;max-width:120px;flex:none}
#badge{background:#fff3cd;color:#7a5600;border-radius:8px;padding:3px 8px;font-size:12px;font-weight:700;white-space:nowrap;cursor:pointer}
#main{flex:1;display:flex;min-height:0;position:relative}
#tools{flex:none;width:70px;background:var(--card);border-inline-end:1px solid var(--bd);overflow-y:auto;display:flex;flex-direction:column;padding:4px;gap:1px}
.tb{border:0;background:none;border-radius:10px;padding:5px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:0;font-size:11px;color:var(--tx);flex:none}
.tb i{font-style:normal;font-size:19px;line-height:1.25}
.tb.on{background:var(--prl);color:var(--pr);font-weight:700}
.tb:disabled{opacity:.3}
#stage{flex:1;position:relative;min-width:0;overflow:hidden;background:var(--cv)}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#props{flex:none;width:280px;background:var(--card);border-inline-start:1px solid var(--bd);overflow-y:auto;padding:8px 12px 20px}
#hint{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:6px 10px;display:flex;gap:6px;align-items:center;box-shadow:0 4px 14px rgba(0,0,0,.1);font-size:12.5px;width:max-content;max-width:calc(100% - 20px);flex-wrap:wrap;justify-content:center;z-index:5}
#hint input{width:110px;min-height:30px;padding:3px 8px}
#v3bar{position:absolute;top:10px;right:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap;z-index:5;pointer-events:none}
#v3bar>*{pointer-events:auto}
.chip{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:5px 10px;cursor:pointer;font-size:12.5px;display:inline-flex;gap:5px;align-items:center;user-select:none}
.chip.on{background:var(--pr);color:#fff;border-color:var(--pr)}
#joy{position:absolute;bottom:16px;left:16px;display:grid;grid-template-columns:repeat(3,50px);gap:6px;z-index:5;direction:ltr}
#joy button{height:50px;border-radius:12px;border:1px solid var(--bd);background:var(--card);font-size:20px;touch-action:none;cursor:pointer;color:var(--tx)}
#zoomb{position:absolute;bottom:12px;left:12px;display:flex;flex-direction:column;gap:6px;z-index:5}
#zoomb button{width:40px;height:40px;border-radius:10px;border:1px solid var(--bd);background:var(--card);font-size:18px;cursor:pointer;color:var(--tx)}
.pnl{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;display:none}
.pnl.show{display:block}
.ph{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:6px;padding:7px 10px;z-index:2}
.ph b{flex:1;font-size:16px}
.pb{max-width:840px;margin:0 auto;padding:12px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.mbtn{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;font-size:13.5px;color:var(--tx)}
.mbtn i{font-style:normal;font-size:27px}
.mbtn:hover{border-color:var(--pr)}
.lrow{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--card);margin:8px 0;flex-wrap:wrap}
.lrow .grow{flex:1;min-width:140px}
.lrow.cur{border-color:var(--pr);box-shadow:0 0 0 2px var(--prl)}
#lib{position:fixed;top:54px;bottom:0;right:0;width:340px;max-width:100%;background:var(--card);border-inline-end:1px solid var(--bd);z-index:30;display:none;flex-direction:column;box-shadow:-6px 0 24px rgba(0,0,0,.12)}
#lib.show{display:flex}
.lcat{font-weight:700;margin:12px 2px 6px;font-size:13px;color:var(--mu)}
.lgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.li{border:1px solid var(--bd);border-radius:11px;padding:6px 4px;text-align:center;cursor:pointer;font-size:11.5px;background:var(--card);color:var(--tx)}
.li:hover{border-color:var(--pr)}
.li canvas{width:62px;height:62px;display:block;margin:0 auto 2px}
.pt{font-weight:700;font-size:15px;margin:4px 0 6px;display:flex;align-items:center;gap:6px}
.stat{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--bd);font-size:13px}
.lock{font-size:11px;color:#b07a00}
#prv{background:#e9ecf0}
.prPage{background:#fff;color:#000;max-width:1000px;margin:12px auto;padding:22px;position:relative;overflow:hidden;font-family:Cairo,Tahoma,Arial,sans-serif}
.prPage table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
.prPage td,.prPage th{border:1px solid #999;padding:4px 8px;text-align:center}
.wm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:90px;color:rgba(210,0,0,.13);transform:rotate(-25deg);pointer-events:none;font-weight:700;white-space:nowrap}
.code{font-size:20px;letter-spacing:2px;font-weight:700;direction:ltr;display:inline-block}
@media(min-width:0){.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:0 14px}}
@media(max-width:760px){
 #main{flex-direction:column}
 #tools{order:3;width:auto;height:62px;flex-direction:row;overflow-x:auto;overflow-y:hidden;border:0;border-top:1px solid var(--bd)}
 .tb{min-width:56px}
 #props{display:none;position:absolute;left:0;right:0;bottom:62px;width:auto;max-height:48%;z-index:15;border:0;border-top:1px solid var(--bd);box-shadow:0 -6px 20px rgba(0,0,0,.14);border-radius:16px 16px 0 0}
 #props.open{display:block}
 #propsT{display:inline-flex!important}
 .dsk{display:none!important}
 #lib{top:auto;height:62%;width:100%;bottom:0;border-radius:16px 16px 0 0}
 #zoomb{bottom:10px}
 .seg button{padding:4px 8px}
 #floorSel{max-width:86px;font-size:12px}
 #top{gap:2px;padding:0 4px}
 .ib{min-width:34px;padding:0 4px}
}
#propsT{display:none}
body.view #tools,body.view #props,body.view #bUndo,body.view #bRedo,body.view #propsT,body.view #hint{display:none!important}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.pcard{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:5px}
.pcard canvas{width:100%;height:190px;object-fit:contain;background:#fff;border-radius:10px;border:1px solid var(--bd)}
.boq{width:100%;border-collapse:collapse;font-size:13px}.boq td,.boq th{border:1px solid var(--bd);padding:5px 6px;text-align:center}.boq input{width:100px;min-height:28px;padding:2px 6px}
.prPage .boq td,.prPage .boq th{border-color:#999}
.elv img{width:100%;background:#fff;border:1px solid var(--bd);border-radius:10px}
#prv .ph{flex-wrap:wrap}
#prv select{width:auto;min-height:30px;padding:2px 6px}
@media print{
 body>*{display:none!important}
 #prv{display:block!important;position:static;background:#fff;overflow:visible}
 #prv .ph,.noprint{display:none!important}
 .prPage{margin:0;max-width:none;padding:0 4mm;page-break-after:always}
 .prPage:last-child{page-break-after:auto}
}
</style>
</head>

<script>
const SRC='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
const LIC=/*LIC*/{"m":0}/*LIC*/;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const P='fp_'+(LIC.id||'main')+'_';
function ld(k,d){try{const v=localStorage.getItem(P+k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(P+k,JSON.stringify(v));return true}catch(e){toast('⚠️ تعذّر الحفظ في المتصفح (المساحة ممتلئة أو التخزين محظور)');return false}}
function cyrb53(str,seed=0){let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507);h1^=Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507);h2^=Math.imul(h1^(h1>>>13),3266489909);return(4294967296*(2097151&h2)+(h1>>>0)).toString(36)}
function H(s){let h=String(s);for(let i=0;i<400;i++)h=cyrb53(h+'|'+i,i);return h}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const AR=s=>String(s).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const r1=v=>Math.round(v*10)/10;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),3000)}
function twice(b){clearTimeout(b._t);if(b.dataset.cf){delete b.dataset.cf;b.innerHTML=b.dataset.ot;b.classList.remove('cfm');return true}b.dataset.ot=b.innerHTML;b.dataset.cf=1;b.innerHTML='تأكيد؟';b.classList.add('cfm');b._t=setTimeout(()=>{if(b.dataset.cf){delete b.dataset.cf;b.innerHTML=b.dataset.ot;b.classList.remove('cfm')}},3000);return false}
function dl(name,data,type='application/json'){const blob=data instanceof Blob?data:new Blob([data],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}

function trialState(){if(!isTrial())return{ok:true,full:true};const now=Date.now();if(!T.f)T.f=now;let back=false;if(T.l&&now<T.l-36e5)back=true;else T.l=Math.max(T.l||0,now);sv('trial',T);const end=Math.min(T.f+LIC.d*864e5,(LIC.is||T.f)+(LIC.d+14)*864e5);const left=Math.ceil((end-now)/864e5);return{ok:!back&&left>0,left:Math.max(0,left),back}}
const ALPH='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
function rndStr(n){const a=new Uint32Array(n);try{crypto.getRandomValues(a)}catch(e){for(let i=0;i<n;i++)a[i]=Math.floor(Math.random()*1e9)}return[...a].map(v=>ALPH[v%ALPH.length]).join('')}
const genCode=()=>{const s=rndStr(12);return s.slice(0,4)+'-'+s.slice(4,8)+'-'+s.slice(8)};
function normCode(v){const s=String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'');return s.length===12?s.slice(0,4)+'-'+s.slice(4,8)+'-'+s.slice(8):s}
function tryActivate(v){const c=normCode(v);if(c&&LIC.ah&&H(LIC.id+c)===LIC.ah){T.act=1;T.at=Date.now();sv('trial',T);toast('✅ تم تفعيل النسخة بنجاح، شكراً لك');updBadge();return true}toast('❌ رمز التفعيل غير صحيح');return false}
function showAct(st){hideAll();$('#actScr').classList.remove('hide');fillTexts();$('#acN').textContent=LIC.cn||civ('org')||'—';$('#acId').textContent=LIC.id;$('#acLeft').innerHTML=st.back?'<span style="color:var(--er)">⚠️ تم اكتشاف إرجاع تاريخ الجهاز. صحّح التاريخ أو فعّل النسخة.</span>':st.ok?`⏳ نسخة تجريبية: باقي ${st.left} يوم`:'<span style="color:var(--er)">⛔ انتهت مدة التجربة. أدخل رمز التفعيل للمتابعة.</span>';$('#acCont').classList.toggle('hide',!st.ok)}
$('#acGo').onclick=()=>{if(tryActivate($('#acCode').value))me?resumeApp():startLogin()};

function updBadge(){const b=$('#badge');if(!isTrial()){b.classList.add('hide');return}const st=trialState();b.classList.remove('hide');b.textContent=`تجريبية: باقي ${st.left} يوم`;if(st.left<=3&&!updBadge.w){updBadge.w=1;setTimeout(()=>toast(`⚠️ تبقّى ${st.left} يوم على انتهاء التجربة. تواصل مع المصمم للتفعيل`),1200)}}

function roomBox(o){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;o.pts.forEach(p=>{x0=Math.min(x0,p[0]);y0=Math.min(y0,p[1]);x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1])});return{x0,y0,x1,y1,w:x1-x0,h:y1-y0}}
function isRect(o){if(o.pts.length!==4)return false;const b=roomBox(o);return o.pts.every(p=>(Math.abs(p[0]-b.x0)<.6||Math.abs(p[0]-b.x1)<.6)&&(Math.abs(p[1]-b.y0)<.6||Math.abs(p[1]-b.y1)<.6))}
function wallBounds(f){if(!f.walls.length)return null;let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;f.walls.forEach(w=>{x0=Math.min(x0,w.x1,w.x2);y0=Math.min(y0,w.y1,w.y2);x1=Math.max(x1,w.x1,w.x2);y1=Math.max(y1,w.y1,w.y2)});return{x0,y0,x1,y1,w:x1-x0,h:y1-y0}}
function transformFloor(f,fn){const P=(x,y)=>fn({x,y});
 const opPos=f.ops.map(o=>{const w=wallById(o.w,f);if(!w)return null;const L=wl(w)||1,[a,b]=opRange(o,w),c=(a+b)/2;return P(w.x1+(w.x2-w.x1)/L*c,w.y1+(w.y2-w.y1)/L*c)});
 f.walls.forEach(w=>{const a=P(w.x1,w.y1),b=P(w.x2,w.y2);w.x1=r1(a.x);w.y1=r1(a.y);w.x2=r1(b.x);w.y2=r1(b.y)});
 f.rooms.forEach(r=>r.pts=r.pts.map(p=>{const q=P(p[0],p[1]);return[r1(q.x),r1(q.y)]}));
 f.items.concat(f.labels).forEach(i=>{const q=P(i.x,i.y);i.x=r1(q.x);i.y=r1(q.y)});
 f.dims.forEach(d=>{const a=P(d.x1,d.y1),b=P(d.x2,d.y2);d.x1=r1(a.x);d.y1=r1(a.y);d.x2=r1(b.x);d.y2=r1(b.y)});

 if(opt.only==='boq'||(!opt.only&&$('#prBoq').checked))pages.push(`<div class="prPage">${wm}${head('جدول الكميات والكلفة التقريبية')}<div style="font-size:12px;margin-bottom:3mm">المشروع: <b>${esc(cur.n)}</b>${q.cn?' · العميل: <b>'+esc(q.cn)+'</b>':''} · ${dt}</div>${boqTable(true,false)}<div style="font-size:11px;margin-top:3mm">* الكميات تقديرية ولا تغني عن جدول الكميات الهندسي.</div>${credL}</div>`);
 if(opt.only==='elev'||(!opt.only&&$('#prElev').checked))['front','back','right','left'].forEach(d=>{const c=elevCanvas(d,60);if(c)pages.push(`<div class="prPage">${wm}${head(DIRN[d])}<img src="${c.toDataURL('image/png')}" style="width:100%">${tblock(DIRN[d],'—')}${credL}</div>`)});
 $('#prB').innerHTML=(warn?`<div class="card noprint" style="max-width:700px;margin:10px auto;border-color:var(--er);color:var(--er)">⚠️ المخطط أكبر من الورقة بهذا المقياس. اختر ورقة A3 أو اتجاهاً أفقياً أو مقياساً أصغر.</div>`:'')+pages.map((p,i)=>p.replace('@@N@@',AR(i+1)+' / '+AR(total()))).join('')||'<div class="prPage">المخطط فارغ</div>';$('#prv').classList.add('show');$('#prCred').onchange()}
['#prPaper','#prOr','#prSc','#prBoq','#prElev','#prReq'].forEach(s=>$(s).addEventListener('change',()=>printView()));

window.addEventListener('beforeunload',persistNow);
document.addEventListener('visibilitychange',()=>{if(document.hidden)persistNow()});
function boot(){buildTools();applyTheme();fillTexts();if(LIC.m===2){startViewer();return}if(isTrial()){const st=trialState();showAct(st);return}startLogin()}
boot();
</script>
</body>
