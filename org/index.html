<style>
:root{--pri:#1e5aa8;--pri2:#3b82f6;--prit:#e8f0fb;--bg:#f2f5f9;--card:#fff;--txt:#1d2733;--mut:#6b7785;--bd:#dfe5ec;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--sh:0 2px 10px rgba(20,40,70,.08);--r:12px;--fs:15px}
body.dark{--bg:#0f1720;--card:#18222e;--txt:#e6edf5;--mut:#93a1b1;--bd:#2a3746;--prit:#1c2b3f;--sh:0 2px 12px rgba(0,0,0,.4)}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Cairo',Tahoma,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:var(--fs);line-height:1.6;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.hide{display:none!important}
.btn{background:var(--pri);color:#fff;border:0;border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:.15s;line-height:1.4}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:var(--prit);color:var(--pri)}
body.dark .btn.sec{color:#cfe0ff}
.btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--bd)}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.warn{background:var(--warn)}
.btn.sm{padding:4px 10px;font-size:.88em;border-radius:7px}
.btn.cfm{background:var(--bad)!important;color:#fff!important;border-color:var(--bad)!important;animation:pulse .7s infinite alternate}
@keyframes pulse{to{filter:brightness(1.3)}}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.wide{width:100%;justify-content:center}
input,select,textarea{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 10px;width:100%;outline:none;min-height:38px}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--pri2);box-shadow:0 0 0 3px rgba(59,130,246,.18)}
input[readonly]{background:var(--bg);color:var(--mut)}
input[type=checkbox],input[type=radio]{width:auto;min-height:0;accent-color:var(--pri);margin:0}
input[type=color]{padding:2px;height:34px;width:46px;min-height:0}
input[type=range]{padding:0;min-height:0;accent-color:var(--pri);border:0;box-shadow:none}
input[type=file]{padding:5px}
label{font-size:.88em;color:var(--mut);display:block;margin-bottom:3px}
.chk{display:inline-flex;align-items:center;gap:6px;color:var(--txt);font-size:.92em;cursor:pointer;margin:4px 0 4px 14px}
.tb{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:9px;padding:7px 11px;cursor:pointer;font-weight:600;white-space:nowrap;line-height:1.4}
.tb:hover{background:rgba(255,255,255,.28)}
.tb:disabled{opacity:.4;cursor:default}
#top{position:fixed;top:0;right:0;left:0;height:58px;background:var(--pri);color:#fff;display:flex;align-items:center;gap:6px;padding:0 10px;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.15)}
#top .ttl{font-weight:800;font-size:1.02em;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:40px}
@media(max-width:640px){#top .tx{display:none}#top .tb{padding:7px 9px}}
.badge{background:#fbbf24;color:#3b2a00;border-radius:20px;padding:3px 10px;font-size:.78em;font-weight:700;white-space:nowrap}
main{padding:70px 14px 20px;max-width:1300px;margin:0 auto}
.page{animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
.ph{display:flex;align-items:center;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.ph h2{margin:0;font-size:1.25em;flex:1;min-width:180px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin-bottom:14px;border:1px solid var(--bd)}
.card h3{margin:0 0 10px;font-size:1.04em;color:var(--pri)}
body.dark .card h3{color:#9cc2ff}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:860px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.g2,.g3,.g4{grid-template-columns:1fr}}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>select,.row>input{flex:1;min-width:130px;width:auto}

/* ===== مظهر عصري ===== */
:root{--r:16px;--sh:0 1px 2px rgba(16,24,40,.04),0 6px 20px -6px rgba(16,24,40,.10);--bd:#e4e9f0;--bg:#f4f6fb;--grad:linear-gradient(135deg,var(--pri),var(--pri2))}
body.dark{--bd:#273444;--bg:#0c121b;--card:#151f2b;--sh:0 6px 22px -8px rgba(0,0,0,.55)}
body{background:radial-gradient(1200px 500px at 100% -10%,color-mix(in srgb,var(--pri2) 10%,transparent),transparent 70%),radial-gradient(900px 500px at -10% 110%,color-mix(in srgb,var(--pri) 8%,transparent),transparent 70%),var(--bg);background-attachment:fixed;min-height:100vh}
#top{background:var(--grad);box-shadow:0 6px 24px -8px color-mix(in srgb,var(--pri) 60%,transparent);border-bottom:1px solid rgba(255,255,255,.18)}
#top .ttl{font-size:1.08em;letter-spacing:.2px}
.tb{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.18);border-radius:11px;backdrop-filter:blur(6px);transition:.15s}
.tb:hover{background:rgba(255,255,255,.3);transform:translateY(-1px)}
.btn{background:var(--grad);border-radius:11px;box-shadow:0 4px 12px -5px color-mix(in srgb,var(--pri2) 80%,transparent);font-weight:700}
.btn:hover{filter:brightness(1.07);transform:translateY(-1px)}
.btn:active{transform:none}
.btn.sec{background:var(--prit);box-shadow:none}
.btn.ghost{box-shadow:none;background:var(--card)}
.btn.ok{background:linear-gradient(135deg,#15803d,#22c55e);box-shadow:0 4px 12px -5px #22c55e}.btn.bad{background:linear-gradient(135deg,#b91c1c,#ef4444);box-shadow:0 4px 12px -5px #ef4444}.btn.warn{background:linear-gradient(135deg,#b45309,#f59e0b)}
.btn.sm{border-radius:9px}
.btn.big{padding:11px 20px;font-size:1.05em;border-radius:14px}
.btn.glass{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);box-shadow:none;color:#fff}
input,select,textarea{border-radius:10px;transition:border-color .15s,box-shadow .15s}
.card{border-radius:var(--r);border:1px solid var(--bd);box-shadow:var(--sh);padding:16px}
.card h3{display:flex;align-items:center;gap:6px;font-weight:800}
.ph h2{font-weight:800;color:var(--pri)}
body.dark .ph h2{color:#bfdbfe}
.kpi{position:relative;overflow:hidden;border:1px solid var(--bd);border-radius:var(--r);padding:13px 16px 12px}
.kpi::before{content:'';position:absolute;inset:0 0 auto 0;height:4px;background:var(--grad)}
.kpi.ok,.kpi.bad,.kpi.warn{border-right-color:var(--bd)}
.kpi.bad::before{background:linear-gradient(90deg,#ef4444,#f97316)}.kpi.ok::before{background:linear-gradient(90deg,#16a34a,#22c55e)}.kpi.warn::before{background:linear-gradient(90deg,#d97706,#facc15)}
.kpi .v{font-size:1.45em}
th{background:color-mix(in srgb,var(--prit) 85%,var(--card))}
.tw{border-radius:14px}
.mh{background:var(--grad)}
.mgrid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.mb{border-radius:18px;padding:18px 10px 14px;transition:.18s}
.mb .ic{width:60px;height:60px;border-radius:20px;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:1.75em;background:var(--prit);transition:.18s}
.mb:hover{transform:translateY(-3px);box-shadow:0 14px 30px -12px color-mix(in srgb,var(--pri) 45%,transparent)}
.mb:hover .ic,.mb.on .ic{background:var(--grad);transform:scale(1.05)}
.scr{background:linear-gradient(135deg,var(--pri),var(--pri2) 60%,color-mix(in srgb,var(--pri2) 60%,#ec4899));overflow:hidden}
.scr::before,.scr::after{content:'';position:fixed;border-radius:50%;filter:blur(2px);pointer-events:none}
.scr::before{width:520px;height:520px;top:-180px;right:-160px;background:radial-gradient(circle,rgba(255,255,255,.28),transparent 65%)}
.scr::after{width:620px;height:620px;bottom:-260px;left:-200px;background:radial-gradient(circle,rgba(255,255,255,.2),transparent 65%)}
.abox{position:relative;z-index:1;background:rgba(255,255,255,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.6);border-radius:24px;padding:26px 24px;box-shadow:0 30px 70px -20px rgba(15,23,42,.45)}

.sw{width:auto;height:auto;border-radius:14px;padding:12px 16px;color:#fff;font-weight:700;font-size:.85em;box-shadow:0 4px 12px -6px rgba(0,0,0,.4);transition:.15s}
.sw:hover{transform:translateY(-2px)}
.sw.on{border-color:var(--card);outline:3px solid var(--txt);outline-offset:1px}
.toast{border-radius:14px;backdrop-filter:blur(6px)}
.mbox{border-radius:20px;overflow:hidden}
.mbox .mt{background:linear-gradient(135deg,var(--prit),var(--card))}
#chWrap{background:radial-gradient(circle at 50% 0,var(--card),#e6ebf2);border-radius:18px}
